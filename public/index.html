<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Capstone Project</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <p class="eyebrow">AI-assisted Software Engineering Internship</p>
        <h1 id="project-title">AI Capstone Project</h1>
        <p class="lede">A small workspace for building thoughtful software with AI.</p>
      </header>
      <nav aria-label="Primary navigation">
        <a class="button-link" href="/settings.html">Open project settings</a>
      </nav>
      <section class="panel" aria-labelledby="welcome-title">
        <h2 id="welcome-title">Welcome back</h2>
        <p>Keep the project identity, appearance, and notification preferences in one place.</p>
      </section>
    </main>
    <script>
      fetch("/api/settings")
        .then((response) => response.json())
        .then((settings) => {
          document.getElementById("project-title").textContent = settings.projectName;
          document.body.classList.toggle("theme-dark", settings.theme === "dark");
        })
        .catch(() => {});
    </script>
  </body>
</html>
