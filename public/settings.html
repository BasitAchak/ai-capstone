<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Settings | AI Capstone</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Project Settings</h1>
        <p>Configure capstone project preferences.</p>
      </header>

      <nav>
        <a href="/">← Back to Home</a>
      </nav>

      <section class="card">
        <form id="settings-form">
          <div class="form-group">
            <label for="projectName">Project name</label>
            <input
              type="text"
              id="projectName"
              name="projectName"
              required
              maxlength="80"
            />
          </div>

          <div class="form-group">
            <label for="developerName">Developer name</label>
            <input
              type="text"
              id="developerName"
              name="developerName"
              maxlength="80"
              placeholder="Your name"
            />
          </div>

          <div class="form-group">
            <label for="theme">Theme</label>
            <select id="theme" name="theme">
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </div>

          <div class="form-group">
            <div class="checkbox-row">
              <input
                type="checkbox"
                id="notificationsEnabled"
                name="notificationsEnabled"
              />
              <label for="notificationsEnabled">Enable notifications</label>
            </div>
          </div>

          <div class="actions">
            <button type="submit">Save settings</button>
            <button type="button" class="secondary" id="reset-button">
              Reset
            </button>
          </div>

          <p id="status" class="status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </div>

    <script src="/js/settings.js"></script>
  </body>
</html>
